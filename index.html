<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>انتقل النظام إلى رابط جديد</title>
<meta http-equiv="refresh" content="0; url=https://school-production-56e5.up.railway.app/s/rajhi/">
<link rel="canonical" href="https://school-production-56e5.up.railway.app/s/rajhi/">
<meta name="robots" content="noindex">
<style>
:root{--bg:#f3f7f6;--sf:#fff;--tx:#14211e;--mu:#5a6c67;--ln:#dbe5e2;--br:#0f766e}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1614;--sf:#16211e;--tx:#e8f1ee;--mu:#9bb0aa;--ln:#2a3b36;--br:#2bb5a6}}
:root[data-theme="dark"]{--bg:#0e1614;--sf:#16211e;--tx:#e8f1ee;--mu:#9bb0aa;--ln:#2a3b36;--br:#2bb5a6}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px 16px;background:var(--bg);color:var(--tx);font-family:Tajawal,'Segoe UI',Tahoma,Arial,sans-serif;text-align:center}
.card{max-width:420px;width:100%;background:var(--sf);border:1px solid var(--ln);border-radius:16px;padding:26px 20px}
h1{font-size:20px;margin:0 0 8px}
p{color:var(--mu);margin:0 0 18px;line-height:1.7}
a.btn{display:inline-block;background:var(--br);color:#fff;text-decoration:none;font-weight:700;border-radius:10px;padding:12px 22px}
small{display:block;margin-top:14px;color:var(--mu);direction:ltr;word-break:break-all}
</style>
<script>
/* نمسح عامل الخدمة والملفات المخزنة للنسخة القديمة ثم ننتقل للرابط الجديد */
(async function(){
  try{if('serviceWorker' in navigator){const rs=await navigator.serviceWorker.getRegistrations();await Promise.all(rs.map(r=>r.unregister()))}}catch(e){}
  try{if(window.caches){const ks=await caches.keys();await Promise.all(ks.map(k=>caches.delete(k)))}}catch(e){}
  location.replace('https://school-production-56e5.up.railway.app/s/rajhi/');
})();
</script>
</head>
<body>
<div class="card">
<h1>انتقل نظام التحضير إلى رابط جديد</h1>
<p>جاري تحويلك تلقائياً… إن لم يتم التحويل اضغط الزر، واحفظ الرابط الجديد في المفضلة أو أعد تثبيت التطبيق منه.</p>
<a class="btn" href="https://school-production-56e5.up.railway.app/s/rajhi/">فتح النظام الجديد</a>
<small>https://school-production-56e5.up.railway.app/s/rajhi/</small>
</div>
</body>
</html>
