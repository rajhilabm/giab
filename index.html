<style>
:root{--bg:#f3f7f6;--sf:#ffffff;--sf2:#f7faf9;--tx:#14211e;--mu:#5a6c67;--ln:#dbe5e2;--br:#0f766e;--brd:#0b5c56;--brs:#e0f3f0;--ok:#166534;--okb:#dcf4e4;--bad:#b42318;--badb:#fde6e3;--wn:#8f4f08;--wnb:#fdeed0;--in:#1d4f91;--inb:#e0ecfb;--sh:0 1px 2px rgba(20,40,35,.06),0 6px 18px rgba(20,40,35,.06);
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1614;--sf:#16211e;--sf2:#1b2925;--tx:#e8f1ee;--mu:#9bb0aa;--ln:#2a3b36;--br:#2bb5a6;--brd:#4fd0c1;--brs:#173a36;--ok:#7be0a0;--okb:#173a26;--bad:#ff9b8f;--badb:#411d19;--wn:#f5c46f;--wnb:#40300f;--in:#8fbcf5;--inb:#182c47;--sh:0 1px 2px rgba(0,0,0,.4)}}
:root[data-theme="dark"]{--bg:#0e1614;--sf:#16211e;--sf2:#1b2925;--tx:#e8f1ee;--mu:#9bb0aa;--ln:#2a3b36;--br:#2bb5a6;--brd:#4fd0c1;--brs:#173a36;--ok:#7be0a0;--okb:#173a26;--bad:#ff9b8f;--badb:#411d19;--wn:#f5c46f;--wnb:#40300f;--in:#8fbcf5;--inb:#182c47;--sh:0 1px 2px rgba(0,0,0,.4)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:'Tajawal','Segoe UI',Tahoma,'Noto Naskh Arabic',Arial,sans-serif;font-size:16px;line-height:1.55;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{margin:0;line-height:1.3}
.wrap{max-width:1100px;margin:0 auto;padding:0 14px}
header.top{background:var(--br);color:#fff}
header.top .wrap{display:flex;align-items:center;gap:12px;padding-top:12px;padding-bottom:12px}
.logo{width:38px;height:38px;border-radius:11px;background:rgba(255,255,255,.18);display:grid;place-items:center;font-weight:800;font-size:20px}
.logo svg{width:24px;height:24px;display:block}
/* شريط علوي بلون الهوية خلف شريط حالة الجوال عند تشغيل الموقع كتطبيق */
body::before{content:'';position:fixed;top:0;left:0;right:0;height:env(safe-area-inset-top,0px);background:var(--br);z-index:100;pointer-events:none}
.applogo{width:64px;height:64px;border-radius:18px;display:block;margin:0 auto 10px;box-shadow:var(--sh)}
.brandt{flex:1;min-width:0}
.brandt b{display:block;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brandt small{opacity:.85;font-size:13px}
.uchip{display:flex;align-items:center;gap:8px;font-size:14px}
.uchip .un{max-width:110px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.btn{border:1px solid var(--ln);background:var(--sf);border-radius:10px;padding:8px 14px;cursor:pointer;font-weight:500;min-height:40px;display:inline-flex;align-items:center;justify-content:center;gap:6px;transition:background .15s,transform .05s}
.btn:hover{background:var(--sf2)}.btn:active{transform:scale(.98)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.primary{background:var(--br);border-color:var(--br);color:#fff}.btn.primary:hover{background:var(--brd)}
.btn.danger{background:var(--bad);border-color:var(--bad);color:#fff}
.btn.wa{background:#25d366;border-color:#25d366;color:#0b2e1c}.btn.wa:hover{background:#1eb958}
.btn.openin{width:100%;background:#dc2626;border-color:#dc2626;color:#fff;font-size:20px;font-weight:800;padding:16px;border-radius:14px;box-shadow:0 6px 18px rgba(220,38,38,.28)}.btn.openin:hover{background:#b91c1c}
.orsep{display:flex;align-items:center;gap:10px;color:var(--mut);font-size:13px;margin:18px 0 14px}.orsep::before,.orsep::after{content:'';flex:1;height:1px;background:var(--ln)}
.optbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;background:var(--sf);border:1px solid var(--ln);border-radius:14px;padding:10px 14px;margin-bottom:12px;box-shadow:var(--sh)}
.optbar label.ck{padding:0}
.btn.ghost{background:transparent}
.btn.sm{min-height:32px;padding:4px 10px;font-size:14px;border-radius:8px}
header.top .btn{background:rgba(255,255,255,.16);border-color:transparent;color:#fff}
nav.tabs{background:var(--sf);border-bottom:1px solid var(--ln);position:sticky;top:env(safe-area-inset-top,0px);z-index:20}
nav.tabs .wrap{display:flex;gap:4px;overflow-x:auto;padding-top:6px;padding-bottom:6px;scrollbar-width:none}
nav.tabs button{border:0;background:transparent;padding:9px 14px;border-radius:10px;cursor:pointer;white-space:nowrap;font-weight:500;color:var(--mu)}
nav.tabs button.on{background:var(--brs);color:var(--brd);font-weight:700}
main{padding:16px 0 90px}
.card{background:var(--sf);border:1px solid var(--ln);border-radius:14px;box-shadow:var(--sh);padding:16px;margin-bottom:14px}
.card h3{font-size:17px;margin-bottom:10px}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:14px}
.kpi{background:var(--sf);border:1px solid var(--ln);border-radius:14px;padding:12px 14px}
.kpi b{display:block;font-size:26px;line-height:1.2}.kpi span{color:var(--mu);font-size:13px}
.kpi.ok b{color:var(--ok)}.kpi.bad b{color:var(--bad)}.kpi.wn b{color:var(--wn)}.kpi.in b{color:var(--in)}
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font-size:13px;font-weight:600;background:var(--sf2);color:var(--mu);white-space:nowrap}
.pill.ok{background:var(--okb);color:var(--ok)}.pill.bad{background:var(--badb);color:var(--bad)}.pill.wn{background:var(--wnb);color:var(--wn)}.pill.in{background:var(--inb);color:var(--in)}
.banner{display:flex;gap:10px;align-items:center;border-radius:12px;padding:10px 14px;margin-bottom:14px;font-weight:600;flex-wrap:wrap}
.banner.ok{background:var(--okb);color:var(--ok)}.banner.bad{background:var(--badb);color:var(--bad)}.banner.in{background:var(--inb);color:var(--in)}
.banner .sp{flex:1}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.bar .sp{flex:1}
input[type=text],input[type=password],input[type=search],input[type=date],input[type=time],select,textarea{width:100%;background:var(--sf);border:1px solid var(--ln);border-radius:10px;padding:9px 12px;min-height:42px}
.bar input[type=text],.bar input[type=search],.bar select,.bar input[type=date]{width:auto;min-width:150px}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--br);outline-offset:1px}
label.f{display:block;margin-bottom:12px;font-weight:500;font-size:14px}
label.f>span{display:block;margin-bottom:4px;color:var(--mu)}
label.ck{display:flex;align-items:center;gap:8px;padding:6px 4px;cursor:pointer}
label.ck input{width:18px;height:18px;accent-color:var(--br)}
.ckbox{max-height:170px;overflow:auto;border:1px solid var(--ln);border-radius:10px;padding:4px 10px}
.tw{overflow-x:auto;padding:0}
table{width:100%;border-collapse:collapse;font-size:15px}
th,td{padding:9px 12px;text-align:right;border-bottom:1px solid var(--ln);white-space:nowrap}
th{background:var(--sf2);color:var(--mu);font-weight:600;font-size:13px}
td.wrapc{white-space:normal;min-width:160px}
tr:last-child td{border-bottom:0}
.muted{color:var(--mu)}.small{font-size:13px}
.center{min-height:60vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;padding:20px}
.spin{width:34px;height:34px;border:4px solid var(--ln);border-top-color:var(--br);border-radius:50%;animation:sp 0.8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.auth{max-width:400px;margin:6vh auto 0;padding:0 14px}
.auth .card{padding:22px}
.auth h1{font-size:22px;margin-bottom:4px}
.classes{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.ccard{background:var(--sf);border:1px solid var(--ln);border-radius:14px;padding:14px;text-align:right;cursor:pointer;box-shadow:var(--sh);display:flex;flex-direction:column;gap:8px}
.ccard:hover{border-color:var(--br)}
.ccard b{font-size:18px}
.sr{background:var(--sf);border:1px solid var(--ln);border-radius:12px;padding:10px 12px;margin-bottom:8px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;border-right:5px solid var(--ok)}
.sr.c-a{border-right-color:var(--bad)}.sr.c-l{border-right-color:var(--wn)}.sr.c-e{border-right-color:var(--in)}
.sn{flex:1 1 180px;display:flex;align-items:baseline;gap:8px;min-width:0}
.sn .ix{color:var(--mu);font-size:13px;min-width:24px}.sn .nm{font-weight:600}.sn small{color:var(--mu)}
.seg{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;flex:1 1 260px}
.sb{border:1px solid var(--ln);background:var(--sf2);border-radius:9px;min-height:42px;cursor:pointer;font-weight:600;font-size:14px;color:var(--mu)}
.sb:disabled{cursor:not-allowed;opacity:.7}
.sb.on.b-p{background:var(--okb);border-color:var(--ok);color:var(--ok)}
.sb.on.b-a{background:var(--bad);border-color:var(--bad);color:#fff}
.sb.on.b-l{background:var(--wn);border-color:var(--wn);color:#fff}
.sb.on.b-e{background:var(--in);border-color:var(--in);color:#fff}
.sum{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-bottom:12px}
.sum div{background:var(--sf);border:1px solid var(--ln);border-radius:12px;text-align:center;padding:8px 4px}
.sum b{display:block;font-size:22px}.sum span{font-size:12px;color:var(--mu)}
.sum .a b{color:var(--bad)}.sum .l b{color:var(--wn)}.sum .e b{color:var(--in)}.sum .p b{color:var(--ok)}
.savebar{position:sticky;bottom:0;background:var(--sf);border-top:1px solid var(--ln);padding:10px 14px calc(10px + env(safe-area-inset-bottom,0px));margin:12px -14px 0;display:flex;gap:10px;align-items:center;z-index:15}
.savebar .sp{flex:1}
.ov{position:fixed;inset:0;background:rgba(10,20,18,.55);z-index:50;display:flex;align-items:flex-end;justify-content:center;padding:0;padding-top:env(safe-area-inset-top,0px)}
@media(min-width:640px){.ov{align-items:center;padding:20px}}
.modal{background:var(--sf);border-radius:18px 18px 0 0;width:100%;max-width:520px;max-height:92%;display:flex;flex-direction:column;box-shadow:0 20px 50px rgba(0,0,0,.35)}
@media(min-width:640px){.modal{border-radius:18px}}
.modal.wide{max-width:720px}
.mh{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:1px solid var(--ln)}
.mh h3{font-size:18px}
.x{border:0;background:transparent;font-size:26px;line-height:1;cursor:pointer;color:var(--mu);padding:0 6px}
.mb{padding:16px 18px;overflow:auto}
.mf{display:flex;gap:8px;justify-content:flex-start;padding:12px 18px calc(12px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--ln);flex-wrap:wrap}
.mf .btn{flex:1 1 110px}
#toast{position:fixed;left:0;right:0;bottom:calc(20px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;align-items:center;gap:8px;z-index:80;pointer-events:none}
.tst{background:#14211e;color:#fff;padding:10px 18px;border-radius:12px;box-shadow:0 8px 24px rgba(0,0,0,.3);font-weight:500;max-width:92%;animation:up .2s}
.tst.bad{background:#b42318}.tst.ok{background:#166534}
@keyframes up{from{transform:translateY(10px);opacity:0}}
.pbar{height:8px;background:var(--ln);border-radius:6px;overflow:hidden;min-width:70px}
.pbar i{display:block;height:100%;background:var(--ok)}
.pbar.wn i{background:var(--wn)}.pbar.bad i{background:var(--bad)}
.days{display:flex;flex-wrap:wrap;gap:8px}
.days label{display:flex;align-items:center;gap:6px;background:var(--sf2);border:1px solid var(--ln);border-radius:10px;padding:6px 12px;cursor:pointer}
.radios{display:grid;gap:8px}
.radios label{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--ln);border-radius:12px;padding:10px 12px;cursor:pointer}
.radios label.on{border-color:var(--br);background:var(--brs)}
.radios input{margin-top:5px;accent-color:var(--br)}
.res{border:1px solid var(--ln);border-radius:10px;margin-top:6px;max-height:220px;overflow:auto}
.res button{display:flex;width:100%;justify-content:space-between;border:0;border-bottom:1px solid var(--ln);background:var(--sf);padding:10px 12px;cursor:pointer;text-align:right}
.res button:hover{background:var(--brs)}
.seglist{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.seglist button{border:1px solid var(--ln);background:var(--sf);border-radius:999px;padding:7px 16px;cursor:pointer;font-weight:500}
.seglist button.on{background:var(--br);color:#fff;border-color:var(--br)}
.note{background:var(--wnb);color:var(--wn);border-radius:10px;padding:10px 12px;font-size:14px}
@media(max-width:520px){.sum b{font-size:18px}.uchip .un{display:none}}
</style>
</head>
<body>
<div id="app"></div>
<div id="modal-root"></div>
<div id="toast" aria-live="polite"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
'use strict';
/* ================= أيقونة التطبيق ودعم PWA ================= */
/* أيقونة الموقع بصيغة SVG مضمّنة داخل الملف (تعمل حتى لو لم تُرفع ملفات الأيقونات) */
const ICON_URI='data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCA1MTIgNTEyIj48ZGVmcz48bGluZWFyR3JhZGllbnQgaWQ9ImciIHgxPSIwIiB5MT0iMCIgeDI9IjEiIHkyPSIxIj48c3RvcCBvZmZzZXQ9IjAiIHN0b3AtY29sb3I9IiMwZDZhNjIiLz48c3RvcCBvZmZzZXQ9IjEiIHN0b3AtY29sb3I9IiMyMGIyYTAiLz48L2xpbmVhckdyYWRpZW50PjwvZGVmcz48cmVjdCB3aWR0aD0iNTEyIiBoZWlnaHQ9IjUxMiIgcng9IjExMyIgZmlsbD0idXJsKCNnKSIvPjxwYXRoIGQ9Ik0xNTAgMjcyTDIyMiAzNDRMMzY2IDE3NiIgZmlsbD0ibm9uZSIgc3Ryb2tlPSIjZmZmIiBzdHJva2Utd2lkdGg9IjU4IiBzdHJva2UtbGluZWNhcD0icm91bmQiIHN0cm9rZS1saW5lam9pbj0icm91bmQiLz48L3N2Zz4=';
const MARK_SVG='<svg viewBox="0 0 512 512" aria-hidden="true"><path d="M150 272L222 344L366 176" fill="none" stroke="currentColor" stroke-width="62" stroke-linecap="round" stroke-linejoin="round"/></svg>';
let deferredPrompt=null;
const standalone=()=>{try{return window.matchMedia('(display-mode: standalone)').matches||window.matchMedia('(display-mode: fullscreen)').matches||window.navigator.standalone===true}catch(e){return false}};
const canInstall=()=>!!deferredPrompt&&!standalone();
const isIOS=()=>/iPad|iPhone|iPod/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredPrompt=e;if(S.phase&&S.phase!=='boot')render()});
window.addEventListener('appinstalled',()=>{deferredPrompt=null;toast('تم تثبيت التطبيق على جهازك','ok');render()});
/* عند غياب ملف manifest.json نبني بديلاً في الذاكرة ليبقى التثبيت ممكناً بملف واحد */
function inlineManifest(){
  try{
    const base=location.href.split('?')[0].split('#')[0];
    const m={name:'نظام تحضير الطلاب',short_name:'التحضير',id:base,start_url:base,scope:base.replace(/[^/]*$/,''),
      display:'standalone',orientation:'any',background_color:'#f3f7f6',theme_color:'#0f766e',lang:'ar',dir:'rtl',
      icons:[{src:ICON_URI,sizes:'any',type:'image/svg+xml',purpose:'any'},{src:ICON_URI,sizes:'any',type:'image/svg+xml',purpose:'maskable'}]};
    const url=URL.createObjectURL(new Blob([JSON.stringify(m)],{type:'application/manifest+json'}));
    const l=document.querySelector('link[rel=manifest]');if(l)l.href=url;
  }catch(e){}
}
async function initPwa(){
  try{const r=await fetch('manifest.json',{cache:'no-store'});if(!r.ok)throw 0;await r.json()}catch(e){inlineManifest()}
  if('serviceWorker' in navigator&&(location.protocol==='https:'||location.hostname==='localhost')){
    try{await navigator.serviceWorker.register('sw.js')}catch(e){console.warn('لم يُسجَّل ملف sw.js (اختياري):',e&&e.message)}
  }
}
async function installApp(){
  if(deferredPrompt){
    const p=deferredPrompt;deferredPrompt=null;
    try{p.prompt();await p.userChoice}catch(e){}
    render();return;
  }
  openModal('تثبيت التطبيق على الجهاز',
`<p style="margin-top:0">${standalone()?'التطبيق مثبَّت لديك بالفعل ويعمل الآن كتطبيق مستقل. ✅':'إن لم يظهر زر التثبيت تلقائياً، ثبّته يدوياً من المتصفح:'}</p>
${standalone()?'':`<div class="note" style="margin-bottom:10px"><b>آيفون / آيباد (Safari):</b> زر المشاركة <b>⬆️</b> ← «إضافة إلى الشاشة الرئيسية».</div>

async function refreshApp(){
  try{
    if('serviceWorker' in navigator){const rs=await navigator.serviceWorker.getRegistrations();await Promise.all(rs.map(r=>r.unregister()))}
    if(window.caches){const ks=await caches.keys();await Promise.all(ks.map(k=>caches.delete(k)))}
  }catch(e){}
  location.reload();
}

function errMsg(e){
  const c=e&&e.code,m=String((e&&e.message)||e||'');
  if(c==='P0001')return m;
  if(c==='42501')return 'لا تملك صلاحية تنفيذ هذا الإجراء';
  if(c==='23505')return 'القيمة موجودة مسبقاً';
  if(c==='conflict')return 'تم تعديل هذه البيانات من جهاز آخر في نفس اللحظة، أعد المحاولة';
  if(c==='PGRST301'||/JWT|token.*expired/i.test(m))return 'انتهت الجلسة، سجّل الدخول مرة أخرى';
  if(/Failed to fetch|NetworkError|Load failed/i.test(m))return 'تعذر الاتصال بالإنترنت';
  return 'حدث خطأ: '+m;
}
function authMsg(e){
  const m=String((e&&e.message)||'');
  if(/email.*invalid|invalid.*email/i.test(m))return 'رفض Supabase صيغة البريد الداخلي. غيّر EMAIL_DOMAIN في أعلى الملف إلى نطاق حقيقي ثم أعد المحاولة';
  if(/password/i.test(m)&&/(short|least|weak|characters)/i.test(m))return 'كلمة المرور لا تحقق سياسة Supabase (قصيرة أو ضعيفة)';
  if(/rate limit|too many/i.test(m))return 'محاولات كثيرة، انتظر قليلاً ثم أعد المحاولة';
  return errMsg(e);
}

function deepClone(x){return JSON.parse(JSON.stringify(x??{}))}
function deepMerge(a,b){for(const k of Object.keys(b)){const x=a[k],y=b[k];if(y&&typeof y==='object'&&!Array.isArray(y)&&x&&typeof x==='object'&&!Array.isArray(x))deepMerge(x,y);else a[k]=y}return a}
function makeSnap(id,data){return {id,exists:data!==undefined,data:()=>deepClone(data)}}
function dbErr(error){const e=new Error(error?.message||'Supabase error');e.code=error?.code||'supabase_error';e.status=error?.status;return e}

/* استعلام: الفلترة تتم على الخادم (data->>الحقل) مع تقسيم النتائج على صفحات */
class SBQuery{
  constructor(name,filters=[]){this.name=name;this.filters=filters}
  where(field,op,value){return new SBQuery(this.name,this.filters.concat([[field,op,value]]))}
  _build(){
    let q=sb.from(this.name).select('id,data');
    for(const [f,op,v] of this.filters){
      const col='data->>'+f;
      if(op==='==')q=q.eq(col,v);else if(op==='>=')q=q.gte(col,v);else if(op==='<=')q=q.lte(col,v);
      else throw new Error('عامل غير مدعوم: '+op);
    }
    return q.order('id');
  }
  async _load(){
    if(!sb)throw new Error('Supabase غير مهيأ');
    const rows=[];
    for(let from=0;;from+=1000){
      const {data,error}=await this._build().range(from,from+999);
      if(error)throw dbErr(error);
      rows.push(...(data||[]));
      if(!data||data.length<1000)break;
    }
    return rows.map(r=>{const x={id:r.id,...deepClone(r.data||{})};return makeSnap(x.id,x)});
  }
  async get(){return {docs:await this._load()}}
}
class SBDoc{
  constructor(path){this.path=path}
  _parts(){return String(this.path).split('/').filter(Boolean)}
  _tableId(){const p=this._parts();if(p.length!==2)throw new Error('مسار قاعدة البيانات غير صحيح: '+this.path);let table=p[0],id=p[1];if(table==='meta')table='settings';return{table,id}}
  async get(){const {table,id}=this._tableId();const {data,error}=await sb.from(table).select('id,data').eq('id',id).maybeSingle();if(error)throw dbErr(error);return makeSnap(id,data?data.data:undefined)}
  async set(data){
    const {table,id}=this._tableId();
    const {error}=await sb.from(table).upsert({id,data:deepClone(data)},{onConflict:'id'});
    if(error)throw dbErr(error);scheduleRefresh(80);
  }
  /* قراءة-تعديل-كتابة مع قفل تفاؤلي (updated_at): لا يضيع تعديل جهاز آخر */
  async mutate(fn){
    const {table,id}=this._tableId();
    for(let i=0;i<6;i++){
      const {data:old,error:e1}=await sb.from(table).select('id,data,updated_at').eq('id',id).maybeSingle();
      if(e1)throw dbErr(e1);
      const next=fn(old?deepClone(old.data):undefined);
      if(!old){
        const {error}=await sb.from(table).insert({id,data:deepClone(next)});
        if(!error){scheduleRefresh(80);return}
        if(error.code!=='23505')throw dbErr(error);
      }else{
        const {data:rows,error}=await sb.from(table).update({data:deepClone(next)}).eq('id',id).eq('updated_at',old.updated_at).select('id');
        if(error)throw dbErr(error);
        if(rows&&rows.length){scheduleRefresh(80);return}
      }
      await sleep(90*(i+1));
    }
    throw Object.assign(new Error('تعذر الحفظ بسبب تعديل متزامن'),{code:'conflict'});
  }
  async update(data){return this.mutate(cur=>{if(cur===undefined)throw Object.assign(new Error('Document not found'),{code:'not-found'});return deepMerge(cur,deepClone(data))})}
  async delete(){const {table,id}=this._tableId();const {error}=await sb.from(table).delete().eq('id',id);if(error)throw dbErr(error);scheduleRefresh(80)}
}
class SupabaseDB{doc(path){return new SBDoc(path)}collection(name){return new SBQuery(name)}}

function decRec(r){const m={};(r.m||[]).forEach(x=>{const i=x.lastIndexOf(':');m[x.slice(0,i)]=x.slice(i+1)});return{by:r.by,bn:r.bn,at:r.at,r:r.r||[],m}}
async function subMonth(force=false){

  try{
    const snap=await S.db.collection('att').where('mo','==',mo).get();const m={};
    snap.docs.forEach(d=>{const x=d.data(),days={};for(const [k,v] of Object.entries(x.days||{}))days[k]=decRec(v);m[x.c]=days});

  }catch(e){console.error(e);return false}

/* ================= وقت إدخال الغياب ================= */
function timeGate(){
  const n=nowInfo(),s=S.settings;
  if(s.extendUntil>n.ts)return{open:true,msg:`الإدخال ممدَّد حتى الساعة ${fmtClock(s.extendUntil)}`,ext:true};
  if(s.mode==='open')return{open:true,msg:'الإدخال مفتوح'};
  if(s.mode==='closed')return{open:false,msg:'إدخال الغياب مغلق حالياً من قِبل الإدارة'};
  if(!(s.days||[]).includes(n.dow))return{open:false,msg:'اليوم خارج أيام الدوام المحددة'};
  const a=hm(s.start),b=hm(s.end);
  if(n.min<a)return{open:false,msg:`يفتح إدخال الغياب الساعة ${s.start}`};
  if(n.min>=b)return{open:false,msg:`انتهى وقت إدخال الغياب (${s.end})`};
  return{open:true,msg:`الإدخال مفتوح حتى الساعة ${s.end}`};
}
function entryStatus(u,date,hasRec){
  const n=nowInfo();
  if(date>n.date)return{ok:false,msg:'لا يمكن التحضير لتاريخ مستقبلي'};
  if(isAdmin(u))return{ok:true,msg:'صلاحية الوكيل: الإدخال والتعديل متاحان دائماً',admin:true};
  const p=u.perms||{};
  if(!p.mark)return{ok:false,msg:'لا تملك صلاحية التحضير'};
  if(date<n.date&&!p.pastDates)return{ok:false,msg:'التحضير متاح لتاريخ اليوم فقط'};
  if(hasRec&&!p.editSaved)return{ok:false,msg:'تم حفظ التحضير مسبقاً ولا تملك صلاحية تعديله'};
  if(date===n.date&&!p.bypassTime){const g=timeGate();if(!g.open)return{ok:false,msg:g.msg};return{ok:true,msg:g.msg}}
  return{ok:true,msg:date<n.date?'تعديل تحضير تاريخ سابق':'الإدخال متاح'};
}

async function moveStudents(sids,target){
  const bySrc={};
  sids.forEach(id=>{const i=S.idx.get(id);if(!i||i.cid===target)return;(bySrc[i.cid]=bySrc[i.cid]||[]).push(id)});
  const moved=Object.values(bySrc).reduce((a,b)=>a+b.length,0);
  if(!moved)return 0;
  /* نقرأ آخر نسخة من قوائم المصدر، نضيف الطلاب للهدف أولاً ثم نحذفهم من المصدر:
     لو انقطع الاتصال بين الخطوتين يبقى الطالب مكرراً (لا يضيع) ويمكن تكرار النقل. */
  const items=[];
  for(const [src,ids] of Object.entries(bySrc)){
    const snap=await S.db.doc('rosters/'+src).get();
    const list=(snap.exists?snap.data().list:[])||[];
    list.filter(s=>ids.includes(s.id)).forEach(s=>items.push(s));
  }
  await mutRoster(target,l=>{const have=new Set(l.map(x=>x.id));return [...l,...items.filter(s=>!have.has(s.id))]});
  for(const [src,ids] of Object.entries(bySrc))await mutRoster(src,l=>l.filter(s=>!ids.includes(s.id)));
  return moved;
}

function parseRows(rows){
  let hi=-1,map={};
  for(let i=0;i<Math.min(rows.length,6);i++){
    const m={};(rows[i]||[]).forEach((c,j)=>{const t=nrm(c);if(!t)return;
      if(/جوال|هاتف|موبايل|phone|mobile/i.test(t)){if(m.ph===undefined)m.ph=j}
      else if(/فصل|صف|شعبة|class|grade/i.test(t)){if(m.cls===undefined)m.cls=j}
      else if(/هوية|رقم|سجل|^id$|number|no\.?$/i.test(t)){if(m.num===undefined)m.num=j}
      else if(/اسم|طالب|name|student/i.test(t)){if(m.name===undefined)m.name=j}});
    if(m.name!==undefined){hi=i;map=m;break}
  }
  if(hi<0){map={name:0,cls:1,num:2,ph:3};hi=-1}
  const out=[];
  for(let i=hi+1;i<rows.length;i++){const r=rows[i]||[];const n=nrm(r[map.name]);if(!n)continue;
    out.push({n,cls:map.cls!==undefined?nrm(r[map.cls]):'',num:map.num!==undefined?nrm(r[map.num]):'',ph:map.ph!==undefined?nrm(r[map.ph]):''})}
  return{rows:out,hasCls:map.cls!==undefined,found:hi>=0};
}

async function runImport(){
  const im=S.imp;if(!im||!im.rows.length){toast('اختر ملفاً صحيحاً أولاً','bad');return false}
  const auto=chk('imp-auto'),def=val('imp-def');
  const byNorm=new Map(S.classes.map(c=>[normKey(c.name),c]));
  let usedNums=new Set();S.idx.forEach(s=>{if(s.num)usedNums.add(s.num)});
  const groups=new Map();
  for(const r of im.rows){let cls=null,label=r.cls;
    if(r.cls)cls=byNorm.get(normKey(r.cls));else if(def){cls=S.classes.find(c=>c.id===def);label=cls?cls.name:''}
    const key=cls?cls.id:'new:'+normKey(label||'');
    if(!cls&&(!label||!auto))continue;
    const g=groups.get(key)||{cls,label,rows:[]};g.rows.push(r);groups.set(key,g)}
  let added=0,skipped=0;const skippedRows=im.rows.length;
  for(const g of groups.values()){
    let cid;
    if(g.cls)cid=g.cls.id;else{cid=rid('c');await S.db.doc('classes/'+cid).set({name:g.label,created:Date.now()});byNorm.set(normKey(g.label),{id:cid,name:g.label})}
    let gAdded=0,gSkipped=0,gUsed=null;
    await mutRoster(cid,list=>{
      /* تُعاد المحاولة عند تعارض متزامن، لذلك نبدأ العدّادات من الصفر في كل محاولة */
      gAdded=0;gSkipped=0;gUsed=new Set(usedNums);
      const names=new Set(list.map(s=>normKey(s.n)));
      for(const r of g.rows){
        if((r.num&&gUsed.has(r.num))||names.has(normKey(r.n))){gSkipped++;continue}
        list.push({id:rid('s'),n:r.n,num:r.num,ph:r.ph});names.add(normKey(r.n));if(r.num)gUsed.add(r.num);gAdded++;
      }
      return list;
    });
    added+=gAdded;skipped+=gSkipped;usedNums=gUsed;
  }
  const notPlaced=skippedRows-added-skipped;
  toast(`تمت إضافة ${added} طالب${skipped?` • تجاهل ${skipped} مكرر`:''}${notPlaced>0?` • ${notPlaced} بدون فصل`:''}`,'ok');S.imp=null;
}

const VKEY='att-cards-v1';
function vaultRead(){try{return JSON.parse(localStorage.getItem(VKEY)||'{}')||{}}catch(e){return{}}}
function vaultAll(){if(!S.vault)S.vault=vaultRead();return S.vault}
function vaultGet(uid){return vaultAll()[uid]||{}}
function vaultWrite(){try{localStorage.setItem(VKEY,JSON.stringify(vaultAll()))}catch(e){}}
async function vaultSet(uid,patch){
  if(!uid)return;
  const v=vaultAll();v[uid]={...(v[uid]||{}),...patch,at:nowMs()};vaultWrite();
  if(S.settings.syncPw){try{await S.db.doc('meta/tcards').mutate(cur=>({map:{...((cur&&cur.map)||{}),[uid]:v[uid]}}))}catch(e){console.warn('تعذرت مزامنة بيانات البطاقات',e)}}
}
async function vaultPull(){
  if(!S.settings.syncPw)return false;
  try{
    const d=await S.db.doc('meta/tcards').get();if(!d.exists)return false;
    const m=d.data().map||{},v=vaultAll();let ch=false;
    for(const [k,o] of Object.entries(m)){const c=v[k];if(!c||(o.at||0)>(c.at||0)){v[k]=o;ch=true}}
    if(ch)vaultWrite();
    return ch;
  }catch(e){return false}
}
const pwKnown=u=>noPwFor(u)||!!vaultGet(u.id).pw;

/* ---------- رسالة الواتساب ---------- */
function waPhone(p){
  let d=digits(String(p||'')).replace(/\D/g,'');
  if(!d)return'';
  if(d.startsWith('00'))d=d.slice(2);
  if(d.startsWith('966'))return d;
  if(d.startsWith('0'))return '966'+d.slice(1);
  if(/^5\d{8}$/.test(d))return '966'+d;
  return d;
}
function waText(u){
  const pass=noPwFor(u)?'الدخول باسم المستخدم فقط (بدون كلمة مرور)':(vaultGet(u.id).pw||'(اطلبها من الوكيل)');
  return String(S.settings.waTpl||DEF_WA)
    .replace(/\{name\}/g,u.name).replace(/\{school\}/g,schoolName())
    .replace(/\{link\}/g,siteLink()).replace(/\{user\}/g,u.username).replace(/\{pass\}/g,pass);
}
const isMobileDev=()=>/Android|iPhone|iPad|iPod|Mobile|Windows Phone/i.test(navigator.userAgent||'');
function copyText(t){
  try{if(navigator.clipboard&&navigator.clipboard.writeText)return navigator.clipboard.writeText(t)}catch(e){}
  return new Promise(res=>{
    const a=document.createElement('textarea');a.value=t;a.style.cssText='position:fixed;top:0;opacity:0';
    document.body.appendChild(a);a.focus();a.select();
    try{document.execCommand('copy')}catch(e){}
    a.remove();res();
  });
}

  [{t:'إلغاء',close:true},
   {t:'نسخ الرسالة',fn:()=>{copyText(val('wa-tx'));toast('تم نسخ الرسالة، الصقها في محادثة المعلم','ok');return false}},
   {t:'فتح واتساب',cls:'primary',fn:()=>{

/* ---------- بطاقات الدخول (مقاس بطاقة العمل 85.6×54 ملم) ---------- */
function qrDataUrl(text,size){
  return new Promise(res=>{
    if(!window.QRCode){res('');return}
    try{
      const box=document.createElement('div');
      box.style.cssText='position:fixed;left:-9999px;top:0;opacity:0';
      document.body.appendChild(box);
      new QRCode(box,{text,width:size||300,height:size||300,colorDark:'#0f2a26',colorLight:'#ffffff',correctLevel:QRCode.CorrectLevel.M});
      const done=u=>{try{box.remove()}catch(e){}res(u||'')};
      setTimeout(()=>{
        const c=box.querySelector('canvas');
        if(c){let u='';try{u=c.toDataURL('image/png')}catch(e){}return done(u)}
        const im=box.querySelector('img');
        if(im&&im.src){if(im.complete)return done(im.src);im.onload=()=>done(im.src);im.onerror=()=>done('');return}
        done('');
      },90);
    }catch(e){res('')}
  });
}

/* ---------- منح جميع المعلمين كل الفصول ---------- */
async function setAllClassesForAll(on){
  const tch=S.users.filter(u=>u.role!=='admin');
  if(!tch.length){toast('لا يوجد معلمون','bad');render();return}
  const ok=await askConfirm(on?'كل الفصول لكل المعلمين':'إلغاء كل الفصول',
    on?`سيتم منح جميع المعلمين (${tch.length}) صلاحية الوصول إلى <b>جميع الفصول</b>، بما فيها الفصول التي تضيفها لاحقاً.`
      :`سيعود كل معلم إلى الفصول المسندة له فقط. هل تريد المتابعة؟`,
    on?'منح الجميع':'إلغاء',false);
  if(!ok){render();return}
  let n=0;
  try{
    for(const u of tch){
      const perms={...(u.perms||{}),allClasses:on};
      const {error}=await sb.rpc('admin_save_user',{p_id:u.id,p_email:toEmail(u.username),p_username:u.username,p_name:u.name,p_role:u.role,p_active:u.active!==false,p_class_ids:u.classIds||[],p_perms:perms});
      if(error)throw dbErr(error);
      u.perms=perms;n++;
    }
    toast(on?`تم منح ${n} معلماً جميع الفصول`:'تم إلغاء الوصول لكل الفصول','ok');
  }catch(e){toast(errMsg(e),'bad')}
  S.dataSig=null;scheduleRefresh(50);render();
}

/* ---------- الدخول بدون كلمة مرور ---------- */
async function toggleNoPw(on){
  const tch=S.users.filter(u=>u.role!=='admin'&&!isGuest(u));
  const ok=await askConfirm(on?'دخول المعلمين بدون كلمة مرور':'إيقاف الدخول بدون كلمة مرور',
    on?`سيتم ضبط كلمة مرور داخلية تلقائية لجميع المعلمين (${tch.length}) ليصبح دخولهم باسم المستخدم فقط.<br><br><b>تنبيه أمني:</b> أي شخص يعرف اسم المستخدم سيستطيع الدخول إلى حساب المعلم. حساب الوكيل يبقى بكلمة مرور.`
      :`سيعود المعلمون للدخول بكلمة مرور. كلمات مرورهم الحالية تلقائية ويمكن تخمينها، لذا يُنصح بتوليد كلمات مرور جديدة بعد الإيقاف.`,
    on?'تفعيل':'إيقاف',false);
  if(!ok){render();return}
  try{
    if(on){
      let n=0;
      for(const u of tch){
        const pw=autoPw(u.username);
        const {error}=await sb.rpc('admin_set_password',{p_id:u.id,p_pw:pw});
        if(error)throw dbErr(error);
        await vaultSet(u.id,{pw});n++;
      }
      await S.db.doc('meta/settings').mutate(cur=>({...DEF,...(cur||{}),noPw:true}));
      S.settings.noPw=true;setNoPwFlag(true);
      toast(`تم التفعيل${n?` لـ ${n} معلم`:''}`,'ok');
    }else{
      await S.db.doc('meta/settings').mutate(cur=>({...DEF,...(cur||{}),noPw:false}));
      S.settings.noPw=false;setNoPwFlag(false);
      toast('تم إيقاف الدخول بدون كلمة مرور','ok');
      if(tch.length&&await askConfirm('كلمات المرور','هل تريد توليد كلمات مرور جديدة عشوائية لجميع المعلمين الآن؟ (اطبع البطاقات بعدها لتسليمهم إياها)','توليد',false)){
        for(const u of tch){
          const pw=genPassword(8);
          const {error}=await sb.rpc('admin_set_password',{p_id:u.id,p_pw:pw});
          if(error)throw dbErr(error);
          await vaultSet(u.id,{pw});
        }
        toast('تم توليد كلمات مرور جديدة','ok');
      }
    }
  }catch(e){toast(errMsg(e),'bad')}
  S.sd=null;S.dataSig=null;scheduleRefresh(50);render();
}

/* ---------- إنشاء حساب معلم (يستخدمه النموذج اليدوي واستيراد Excel) ---------- */
const genPassword=(n=8)=>{const a='abcdefghjkmnpqrstuvwxyzABCDEFGHJKLMNPQRSTUVWXYZ23456789';return Array.from(crypto.getRandomValues(new Uint8Array(n)),b=>a[b%a.length]).join('')};
async function createTeacher({name,un,pw,role='teacher',active=true,classIds=[],perms={}}){
  const email=toEmail(un),fail=(m,extra)=>Object.assign(new Error(m),{code:'P0001'},extra||{});
  /* 1) إنشاء حساب المصادقة عبر عميل مؤقت حتى لا نخرج من جلسة الوكيل */
  const tmp=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY,{auth:{persistSession:false,autoRefreshToken:false,detectSessionInUrl:false,storageKey:'att-tmp'}});
  let r=await tmp.auth.signUp({email,password:pw});
  if(r.error&&/already|registered/i.test(r.error.message||'')){
    const c=await sb.rpc('admin_cleanup_orphan',{p_email:email});
    if(c.error)throw dbErr(c.error);
    if(!c.data)throw fail('اسم المستخدم مستخدم مسبقاً');
    r=await tmp.auth.signUp({email,password:pw});
  }
  if(r.error){
    const rate=r.error.status===429||/rate limit|too many|over_/i.test((r.error.code||'')+' '+(r.error.message||''));
    throw fail(rate?'وصلت للحد المسموح من Supabase لإنشاء الحسابات، انتظر بضع دقائق ثم أعد المحاولة':authMsg(r.error),{rate});
  }
  if(!r.data.session)throw fail('فعّل خيار تسجيل الحسابات بدون تأكيد البريد (Confirm email = OFF) في إعدادات Supabase');
  /* 2) ربط الحساب بملف المستخدم (الدور والفصول والصلاحيات) عبر دالة الوكيل */
  const {data:id,error}=await sb.rpc('admin_save_user',{p_id:null,p_email:email,p_username:un,p_name:name,p_role:role,p_active:active,p_class_ids:role==='admin'?[]:classIds,p_perms:role==='admin'?{}:perms});
  if(error)throw dbErr(error);
  return id;
}

const splitCls=t=>String(t||'').split(/[,،;؛\n]+/).map(nrm).filter(Boolean);
function parseTeacherRows(rows){
  let hi=-1,map={};
  for(let i=0;i<Math.min(rows.length,6);i++){
    const m={};(rows[i]||[]).forEach((c,j)=>{const t=normKey(nrm(c));if(!t)return;
      if(/مستخدم|username|user/.test(t)){if(m.un===undefined)m.un=j}
      else if(/مرور|سري|password|pass|pwd/.test(t)){if(m.pw===undefined)m.pw=j}
      else if(/فصل|فصو|صف|class/.test(t)){if(m.cls===undefined)m.cls=j}
      else if(/جوال|هاتف|واتس|phone|mobile|whats/.test(t)){if(m.ph===undefined)m.ph=j}
      else if(/اسم|معلم|name|teacher/.test(t)){if(m.name===undefined)m.name=j}});
    if(m.name!==undefined){hi=i;map=m;break}
  }
  if(hi<0)map={name:0,un:1,pw:2,cls:3};
  const out=[];
  for(let i=hi+1;i<rows.length;i++){
    const r=rows[i]||[];const name=nrm(r[map.name]);
    if(!name&&!r.some(x=>nrm(x)))continue;
    out.push({name,un:map.un!==undefined?nrm(r[map.un]).toLowerCase().replace(/\s/g,''):'',pw:map.pw!==undefined?String(r[map.pw]??'').trim():'',cls:map.cls!==undefined?splitCls(r[map.cls]):[],ph:map.ph!==undefined?nrm(r[map.ph]):'',gpw:genPassword(),gun:'t'+String(Math.floor(Math.random()*90000)+10000)});
  }
  return{rows:out,found:hi>=0};
}
function tchBuild(){
  const im=S.timp;if(!im)return;
  const auto=chk('ti-auto');
  const usedU=new Set(S.users.map(u=>String(u.username).toLowerCase())),usedN=new Set(S.users.map(u=>normKey(u.name)));
  const clsNorm=new Map(S.classes.map(c=>[normKey(c.name),c.name]));
  const newCls=new Map(),items=[];let unknownCls=0;
  for(const r of im.rows){
    const it={name:r.name,un:'',pw:'',phone:r.ph||'',pwAuto:false,unAuto:false,classKeys:[],classNames:[],status:'ok',note:''};
    if(!r.name){it.status='noname';items.push(it);continue}
    if(r.un){it.un=r.un}else{
      it.unAuto=true;
      if(usedN.has(normKey(r.name))){it.status='dup';it.note='الاسم موجود مسبقاً';it.un='—'}
      else{while(usedU.has(r.gun))r.gun='t'+String(Math.floor(Math.random()*90000)+10000);it.un=r.gun}
    }
    if(it.status==='ok'){
      if(!UN_RE.test(it.un)){it.status='badun';it.note='اسم مستخدم غير صالح'}
      else if(usedU.has(it.un)){it.status='dup';it.note='اسم المستخدم موجود مسبقاً'}
    }
    if(it.status==='ok'){
      if(noPwOn()){it.pw=autoPw(it.un);it.pwAuto=true}
      else if(r.pw){if(r.pw.length<6){it.status='badpw';it.note='كلمة المرور أقل من 6 أحرف'}else it.pw=r.pw}
      else{it.pw=r.gpw;it.pwAuto=true}
    }
    if(it.status==='ok'){
      usedU.add(it.un);usedN.add(normKey(r.name));
      for(const cn of r.cls){
        const k=normKey(cn);
        if(clsNorm.has(k)){if(!it.classKeys.includes(k)){it.classKeys.push(k);it.classNames.push(clsNorm.get(k))}}
        else if(auto){if(!newCls.has(k))newCls.set(k,cn);if(!it.classKeys.includes(k)){it.classKeys.push(k);it.classNames.push(cn)}}
        else unknownCls++;
      }
    }
    items.push(it);
  }
  im.items=items;im.newCls=newCls;
  const ok=items.filter(i=>i.status==='ok'),dup=items.filter(i=>i.status==='dup').length,bad=items.filter(i=>['noname','badun','badpw'].includes(i.status)).length;
  const btn=$('#ti-go');if(btn&&!im.done){btn.disabled=!ok.length;btn.textContent=ok.length?`إنشاء ${ok.length} حساب`:'إنشاء الحسابات'}
  $('#ti-prev').innerHTML=`<div class="bar"><span class="pill ok">جاهز: ${ok.length}</span>${dup?`<span class="pill wn">مكرر سيُتخطى: ${dup}</span>`:''}${bad?`<span class="pill bad">صفوف غير صالحة: ${bad}</span>`:''}${newCls.size?`<span class="pill in">فصول جديدة: ${[...newCls.values()].map(esc).join('، ')}</span>`:''}${unknownCls?`<span class="pill wn">فصول غير موجودة سيتم تجاهلها: ${unknownCls}</span>`:''}</div>
${ok.length?`<div class="tw card" style="padding:0"><table><thead><tr><th>الاسم</th><th>اسم المستخدم</th><th>كلمة المرور</th><th>الفصول</th></tr></thead><tbody>${ok.slice(0,8).map(i=>`<tr><td>${esc(i.name)}</td><td dir="ltr" style="text-align:right">${esc(i.un)}${i.unAuto?' <span class="pill">تلقائي</span>':''}</td><td dir="ltr" style="text-align:right">${noPwOn()?'<span class="pill in">بدون كلمة مرور</span>':(i.pwAuto?'<span class="pill">تلقائية</span>':'••••••')}</td><td class="wrapc small">${esc(i.classNames.join('، ')||'—')}</td></tr>`).join('')}</tbody></table></div>${ok.length>8?`<p class="muted small">… و${ok.length-8} آخرين</p>`:''}`:''}`;
}

async function runTeacherImport(){

  }catch(e){toast(errMsg(e),'bad');return false}
  let stop=false;
  for(let n=0;n<ok.length;n++){
    const it=ok[n];

function presetRange(p){
  const n=nowInfo(),t=n.date;
  if(p==='today')return[t,t];
  if(p==='week')return[addDays(t,-n.dow),t];
  if(p==='month')return[t.slice(0,8)+'01',t];
  if(p==='last'){const first=t.slice(0,8)+'01';const to=addDays(first,-1);return[to.slice(0,8)+'01',to]}
  if(p==='90')return[addDays(t,-89),t];
  return null;
}
function initStats(){
  if(S.st)return;const[f,t]=presetRange('month');
  S.st={mode:'class',cid:null,sid:null,preset:'month',from:f,to:t,recs:null,loading:false,sort:'name',q:''};
  fetchStats();
}
async function fetchStats(){
  const st=S.st;if(!st.from||!st.to||st.from>st.to){toast('نطاق التاريخ غير صحيح','bad');return}
  st.loading=true;render();
  try{
    const me=curUser(),allowed=new Set(myClasses(me).map(c=>c.id));
    const snap=await S.db.collection('att').where('mo','>=',st.from.slice(0,7)).where('mo','<=',st.to.slice(0,7)).get();
    const out=[];
    snap.docs.forEach(d=>{const x=d.data();if(!isAdmin(me)&&!allowed.has(x.c))return;for(const[date,r] of Object.entries(x.days||{})){if(date>=st.from&&date<=st.to)out.push({c:x.c,date,...decRec(r)})}});
    st.recs=out;
  }catch(e){toast(errMsg(e),'bad');st.recs=[]}
  st.loading=false;render();
}
const nameOf=sid=>{const i=S.idx.get(sid);return i?i.n:'طالب محذوف'};
function tally(recs){const m=new Map();for(const r of recs)for(const sid of r.r){let s=m.get(sid);if(!s){s={d:0,a:0,l:0,e:0};m.set(sid,s)}s.d++;const c=r.m[sid];if(c==='a')s.a++;else if(c==='l')s.l++;else if(c==='e')s.e++}return m}
const pct=s=>s.d?Math.round((s.d-s.a-s.e)/s.d*1000)/10:null;
const pbar=p=>p===null?'—':`<div style="display:flex;align-items:center;gap:8px"><div class="pbar ${p<85?'bad':p<95?'wn':''}" style="flex:1"><i style="width:${p}%"></i></div><b>${p}%</b></div>`;

function classStatRows(cid){
  const recs=S.st.recs.filter(r=>r.c===cid),t=tally(recs);
  const ids=new Set((S.rosters[cid]||[]).map(s=>s.id));t.forEach((_,k)=>ids.add(k));
  const rows=[...ids].map(id=>{const s=t.get(id)||{d:0,a:0,l:0,e:0};const cur=(S.rosters[cid]||[]).some(x=>x.id===id);return{id,n:nameOf(id),cur,...s,p:pct(s)}});
  const sort=S.st.sort;rows.sort(sort==='abs'?(a,b)=>(b.a+b.e)-(a.a+a.e)||cmpAr(a.n,b.n):sort==='pct'?(a,b)=>(a.p??101)-(b.p??101):(a,b)=>cmpAr(a.n,b.n));
  return{recs,rows};
}

<p class="muted small" style="margin:0 0 14px">عند التفعيل تُضبط كلمة مرور داخلية تلقائية لكل معلم، ويكفيه كتابة اسم المستخدم في صفحة الدخول. <b>تنبيه:</b> أي شخص يعرف اسم المستخدم يستطيع الدخول لحساب المعلم، لذا استخدمه داخل المدرسة فقط. حساب الوكيل يبقى محمياً بكلمة مرور. (يُطبَّق فوراً عند التغيير)</p>
<label class="f"><span>نص رسالة الواتساب الترحيبية</span><textarea id="sd-wa" rows="9" data-inp="sdwa" style="width:100%;border:1px solid var(--ln);border-radius:10px;padding:10px 12px;background:var(--sf);resize:vertical">${esc(d.waTpl||DEF_WA)}</textarea></label>
<p class="muted small" style="margin:-6px 0 14px">المتغيرات المتاحة: <span dir="ltr">{name}</span> اسم المعلم، <span dir="ltr">{user}</span> اسم المستخدم، <span dir="ltr">{pass}</span> كلمة المرور، <span dir="ltr">{link}</span> رابط الموقع، <span dir="ltr">{school}</span> اسم المدرسة.</p>
<div class="optbar" style="margin-bottom:8px"><label class="ck"><input type="checkbox" data-chg="sdsync" ${d.syncPw?'checked':''}> حفظ كلمات المرور في قاعدة البيانات لمزامنتها بين أجهزتك</label></div>
<p class="muted small" style="margin:0 0 14px">افتراضياً تُحفظ كلمات المرور في هذا الجهاز فقط. فعّل المزامنة إن كنت تطبع البطاقات من جهاز آخر، مع العلم أنها ستُخزَّن نصاً في قاعدة البيانات.</p>
<div class="bar" style="margin-bottom:0"><button class="btn" data-act="printAllCards">🖨️ طباعة جميع البطاقات</button><span class="sp"></span><button class="btn primary" data-act="saveSettings">حفظ الإعدادات</button></div></div>
<div class="card"><h3>التطبيق على الأجهزة</h3>
<p class="muted small" style="margin:0 0 10px">يمكن تثبيت الموقع كتطبيق على جوال المعلم أو الكمبيوتر فيفتح بأيقونته الخاصة وبدون شريط المتصفح، ويعمل حتى مع ضعف الاتصال.</p>
<div class="bar" style="margin-bottom:0"><button class="btn primary" data-act="install">${standalone()?'التطبيق مثبَّت ✅':'تثبيت التطبيق'}</button><button class="btn" data-act="refreshApp">تحديث النسخة</button></div></div>
<div class="card"><h3>حسابي</h3><button class="btn" data-act="myPw">تغيير كلمة المرور</button></div>`;
}
async function saveSettings(){
  const d=S.sd;if(!d)return;
  if(hm(d.end)<=hm(d.start)){toast('وقت النهاية يجب أن يكون بعد وقت البداية','bad');return}
  try{
    /* نقرأ آخر نسخة من الخادم ونعدّل الحقول المعنية فقط (لا نمسح extendUntil) */
    await S.db.doc('meta/settings').mutate(cur=>({...DEF,...(cur||{}),schoolName:nrm(d.schoolName),mode:d.mode,start:d.start,end:d.end,days:d.days,tz:d.tz,siteUrl:nrm(d.siteUrl||''),waTpl:String(d.waTpl||''),syncPw:!!d.syncPw}));
    toast('تم حفظ الإعدادات','ok');S.sd=null;render();
  }catch(e){toast(errMsg(e),'bad')}
}
async function extendEntry(min){
  try{
    const {error}=await sb.rpc('admin_extend',{p_min:min});if(error)throw dbErr(error);
    toast(min?`تم فتح الإدخال ${min} دقيقة`:'تم إلغاء التمديد','ok');scheduleRefresh(50);
  }catch(e){toast(errMsg(e),'bad')}
}
function myPwModal(){
  const me=curUser();
  openModal('تغيير كلمة المرور',`<label class="f"><span>كلمة المرور الحالية</span><input type="password" id="pw0" autocomplete="current-password"></label><label class="f"><span>كلمة المرور الجديدة (6 أحرف على الأقل)</span><input type="password" id="pw1" autocomplete="new-password"></label>`,
  [{t:'إلغاء',close:true},{t:'تغيير',cls:'primary',fn:async()=>{
    if(val('pw1').length<6){toast('كلمة المرور الجديدة قصيرة','bad');return false}
    const chk0=await sb.auth.signInWithPassword({email:toEmail(me.username),password:val('pw0')});
    if(chk0.error){toast('كلمة المرور الحالية غير صحيحة','bad');return false}
    const {error}=await sb.auth.updateUser({password:val('pw1')});
    if(error){toast(authMsg(error),'bad');return false}
    toast('تم تغيير كلمة المرور','ok');
  }}]);
}

/* ================= الأحداث ================= */
const ACT={
  async login(){
    if(S.busy)return;
    const un=nrm(val('lu')).toLowerCase().replace(/\s/g,''),pw=val('lp');
    if(!un){toast('أدخل اسم المستخدم','bad');return}
    S.busy=true;
    try{
      /* بدون كلمة مرور: نجرّب الكلمة الداخلية التلقائية المرتبطة باسم المستخدم */
      let r=await sb.auth.signInWithPassword({email:toEmail(un),password:pw||autoPw(un)});
      if(r.error&&pw&&(r.error.status===400||r.error.code==='invalid_credentials')){
        const r2=await sb.auth.signInWithPassword({email:toEmail(un),password:autoPw(un)});
        if(!r2.error)r=r2;
      }
      const {data,error}=r;
      if(error){
        const bad=error.status===400||error.code==='invalid_credentials';
        if(!pw&&bad){
          const b=$('#lp-box');if(b)b.style.display='';setNoPwFlag(false);
          const f=$('#lp');if(f)f.focus();
          toast('هذا الحساب يحتاج كلمة مرور، أدخلها ثم أعد المحاولة','bad');return;
        }
        toast(bad?'اسم المستخدم أو كلمة المرور غير صحيحة':authMsg(error),'bad');return;
      }
      let ok=false,failed=false;
      try{ok=await startSession(data.user.id)}catch(e){failed=true;console.error(e);toast(errMsg(e),'bad')}
      if(!ok){try{await sb.auth.signOut()}catch(e){}S.meId=null;S.phase='auth';render();if(!failed)toast('هذا الحساب موقوف أو غير مضاف للنظام، راجع الوكيل','bad')}
    }finally{S.busy=false}
  },
  async setup(){
    if(S.busy)return;
    const school=nrm(val('su-school')),name=nrm(val('su-name')),un=nrm(val('su-un')).toLowerCase().replace(/\s/g,''),pw=val('su-pw'),code=val('su-code').trim();
    if(!school||!name||!un||!code){toast('أكمل جميع الحقول','bad');return}
    if(!UN_RE.test(un)){toast('اسم المستخدم: من 3 إلى 30 حرفاً إنجليزياً أو أرقاماً أو ( . _ - ) بدون مسافات','bad');return}
    if(pw.length<6){toast('كلمة المرور 6 أحرف على الأقل','bad');return}
    S.busy=true;
    try{
      const email=toEmail(un);
      let r=await sb.auth.signUp({email,password:pw});
      if(r.error&&/already|registered/i.test(r.error.message||''))r=await sb.auth.signInWithPassword({email,password:pw});
      if(r.error){toast(/invalid login/i.test(r.error.message||'')?'اسم المستخدم محجوز، اختر اسماً آخر':authMsg(r.error),'bad');return}
      if(!r.data.session){toast('فعّل خيار تسجيل الحسابات بدون تأكيد البريد (Confirm email = OFF) في إعدادات Supabase ثم أعد المحاولة','bad');return}
      const c=await sb.rpc('claim_first_admin',{p_name:name,p_username:un,p_school:school,p_code:code});
      if(c.error){try{await sb.auth.signOut()}catch(e){}toast(errMsg(dbErr(c.error)),'bad');return}
      S.needsSetup=false;
      let ok=false;try{ok=await startSession(r.data.user.id)}catch(e){console.error(e);toast(errMsg(e),'bad')}
      if(ok)toast('تم إنشاء الحساب. مرحباً بك','ok');else{S.phase='auth';render()}
    }catch(e){console.error(e);toast(errMsg(e),'bad')}
    finally{S.busy=false}
  },
  async logout(){try{await sb.auth.signOut()}catch(e){}resetSession()},
  genpw(){
    const a='abcdefghjkmnpqrstuvwxyzABCDEFGHJKLMNPQRSTUVWXYZ23456789';
    const pw=Array.from(crypto.getRandomValues(new Uint8Array(10)),b=>a[b%a.length]).join('');
    const i=$('#u-pw');if(i){i.value=pw;i.type='text';const c=document.querySelector('[data-chg=showpw]');if(c)c.checked=true}
  },
  nav(t){
    const v=t.dataset.v,me=curUser();S.view=v;
    if(v==='attend'&&isAdmin(me)){const cid=(S.att&&S.att.cid)||(S.classes[0]&&S.classes[0].id);if(cid){openAttend(cid,(S.att&&S.att.date)||nowInfo().date);return}}
    if(v==='settings')S.sd=null;
    if(v==='teachers')vaultPull().then(ch=>{if(ch&&S.view==='teachers')render()}).catch(()=>{});
    if(v==='stats'){initStats();if(S.st.recs)render();return}
    render();
  },
  openClass(t){openAttend(t.dataset.cid,nowInfo().date)},
  mark(t){const a=S.att;if(!a||attStatus().ok===false)return;const sid=t.dataset.sid,c=t.dataset.code;if(c==='p')delete a.draft[sid];else a.draft[sid]=c;a.dirty=true;paintAtt()},
  allPresent(){if(!S.att)return;S.att.draft={};S.att.dirty=true;paintAtt()},
  saveAtt:saveAttendance,
  mclose(){closeModal()},
  extend(t){extendEntry(+t.dataset.min)},
  saveSettings,
  myPw:myPwModal,
  addStu(){studentModal()},editStu(t){studentModal(t.dataset.sid)},delStu(t){deleteStudent(t.dataset.sid)},
  importStu:importModal,moveSel:moveModal,
  moreStu(){S.stu.lim+=100;render()},
  exportStu(){
    const rows=[['الاسم','الفصل','رقم الطالب','جوال ولي الأمر']];stuList().forEach(s=>rows.push([s.n,s.cn,s.num||'',s.ph||'']));
    saveXlsx(`الطلاب-${S.stu.cid==='all'?'كل الفصول':cname(S.stu.cid)}.xlsx`,[{name:'الطلاب',rows}]);
  },
  tplStu(){saveXlsx('قالب-استيراد-الطلاب.xlsx',[{name:'الطلاب',rows:[['اسم الطالب','الفصل','رقم الطالب','جوال ولي الأمر'],['(اكتب اسم الطالب هنا)','(اسم الفصل كما هو في النظام)','','']]}])},
  addClass:addClassModal,renClass(t){renClassModal(t.dataset.cid)},delClass(t){deleteClass(t.dataset.cid)},
  importTch:importTeachersModal,tchResults:exportTchResults,
  tplTch(){saveXlsx('قالب-استيراد-المعلمين.xlsx',[{name:'المعلمون',rows:[['الاسم','اسم المستخدم','كلمة المرور','الفصول','الجوال'],['محمد أحمد','moh.ahmad','','أول / 1، أول / 2','0551234567'],['سعد خالد','','','ثاني / 1','']]}])},
  addUser(){userModal()},editUser(t){userModal(t.dataset.uid)},togUser(t){toggleUser(t.dataset.uid)},delUser(t){deleteUser(t.dataset.uid)},
  waUser(t){waUser(t.dataset.uid)},cardUser(t){cardUser(t.dataset.uid)},printAllCards(){printAllCards()},
  showPw(){const b=$('#lp-box');if(b)b.style.display='';setNoPwFlag(false);const f=$('#lp');if(f)f.focus()},
  install(){installApp()},refreshApp(){refreshApp()},openEntry(){openEntryLogin()},
  stMode(t){S.st.mode=t.dataset.m;render()},
  pickStu(t){S.st.sid=t.dataset.sid;const i=S.idx.get(S.st.sid);S.st.q=i?i.n:'';render()},
  stExport:exportStats,
};
const INP={
  aq(t){S.att.q=t.value;paintAtt2()},
  sq(t){S.stu.q=t.value;S.stu.lim=100;render()},
  sq2(t){S.st.q=t.value;S.st.sid=null;const r=$('#sres');if(r)r.innerHTML=stuResultsHTML(myClasses(curUser()));},
  sdschool(t){S.sd.schoolName=t.value},
  sdsite(t){S.sd.siteUrl=t.value},
  waph(t){const h=$('#wa-hint');if(h){const p=waPhone(t.value);h.textContent=p?'+'+p:''}},
  sdwa(t){S.sd.waTpl=t.value},
};
function paintAtt2(){const st=attStatus();const l=$('#att-list');if(l)l.innerHTML=attListHTML(!st.ok)}
const CHG={
  async aclass(t){openAttend(t.value,S.att.date)},
  async adate(t){if(t.value)openAttend(S.att.cid,t.value)},
  sfcls(t){S.stu.cid=t.value;S.stu.sel=new Set();S.stu.lim=100;render()},
  sel(t){t.checked?S.stu.sel.add(t.dataset.sid):S.stu.sel.delete(t.dataset.sid);render()},
  selall(t){const shown=stuList().slice(0,S.stu.lim);shown.forEach(s=>t.checked?S.stu.sel.add(s.id):S.stu.sel.delete(s.id));render()},
  showpw(t){const i=document.getElementById(t.dataset.for);if(i)i.type=t.checked?'text':'password'},
  urole(t){const b=$('#u-tbox');if(b)b.style.display=t.value==='admin'?'none':'';const p=$('#u-pwbox');if(p)p.style.display=(noPwOn()&&t.value!=='admin')?'none':''},
  allcls(t){setAllClassesForAll(t.checked)},
  sdnopw(t){toggleNoPw(t.checked)},
  sdopen(t){toggleOpenEntry(t.checked)},
  sdsync(t){S.sd.syncPw=t.checked},
  tchrebuild(){tchBuild()},
  tchfile(t){
    const f=t.files&&t.files[0];if(!f)return;
    if(!window.XLSX){toast('تعذر تحميل مكتبة Excel','bad');return}
    const rd=new FileReader();
    rd.onload=()=>{try{const wb=XLSX.read(rd.result,{type:'array'});const ws=wb.Sheets[wb.SheetNames[0]];const rows=XLSX.utils.sheet_to_json(ws,{header:1,defval:''});const p=parseTeacherRows(rows);
      if(!p.rows.length){$('#ti-prev').innerHTML='<div class="note" style="margin-top:10px">لم يتم العثور على معلمين في الملف.</div>';S.timp=null;return}
      S.timp={rows:p.rows,done:false};tchBuild()}catch(e){console.error(e);toast('تعذر قراءة الملف','bad')}};
    rd.readAsArrayBuffer(f);
  },
  impfile(t){
    const f=t.files&&t.files[0];if(!f)return;
    if(!window.XLSX){toast('تعذر تحميل مكتبة Excel','bad');return}
    const rd=new FileReader();
    rd.onload=()=>{try{const wb=XLSX.read(rd.result,{type:'array'});const ws=wb.Sheets[wb.SheetNames[0]];const rows=XLSX.utils.sheet_to_json(ws,{header:1,defval:''});const p=parseRows(rows);S.imp=p;$('#imp-prev').innerHTML=p.rows.length?impPreviewHTML():'<div class="note" style="margin-top:10px">لم يتم العثور على أسماء طلاب في الملف.</div>'}catch(e){toast('تعذر قراءة الملف','bad')}};
    rd.readAsArrayBuffer(f);
  },
  stpre(t){const p=t.value;S.st.preset=p;const r=presetRange(p);if(r){S.st.from=r[0];S.st.to=r[1];fetchStats()}else render()},
  stfrom(t){S.st.from=t.value;S.st.preset='custom';fetchStats()},
  stto(t){S.st.to=t.value;S.st.preset='custom';fetchStats()},
  stcls(t){S.st.cid=t.value;render()},
  stsort(t){S.st.sort=t.value;render()},
  sdmode(t){S.sd.mode=t.value;render()},
  sdstart(t){S.sd.start=t.value},sdend(t){S.sd.end=t.value},sdtz(t){S.sd.tz=t.value},
  sdday(t){const d=+t.dataset.d,set=new Set(S.sd.days||[]);t.checked?set.add(d):set.delete(d);S.sd.days=[...set].sort()},
};
document.addEventListener('click',e=>{const t=e.target.closest('[data-act]');if(!t||t.disabled)return;const f=ACT[t.dataset.act];if(f){const r=f(t,e);if(r&&r.catch)r.catch(err=>toast(errMsg(err),'bad'))}});
document.addEventListener('input',e=>{const t=e.target.closest('[data-inp]');if(t&&INP[t.dataset.inp])INP[t.dataset.inp](t,e)});
document.addEventListener('change',e=>{const t=e.target.closest('[data-chg]');if(t&&CHG[t.dataset.chg]){const r=CHG[t.dataset.chg](t,e);if(r&&r.catch)r.catch(err=>toast(errMsg(err),'bad'))}});
document.addEventListener('keydown',e=>{if(e.key==='Enter'){const t=e.target.closest('[data-enter]');if(t&&ACT[t.dataset.enter])ACT[t.dataset.enter]()}});
init();
initPwa();
</script>
</body></html>
